# Build the agent image and roll it out to Cloud Run.
#
# Wire this to a trigger so a push to your default branch ships the agent:
#
#   gcloud builds triggers create github \
#     --name=agent-main \
#     --repo-owner=<org> --repo-name=<repo> --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_INSTANCE=<instance>
#
# Or run it by hand:
#
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_INSTANCE=<instance>,SHORT_SHA=$(git rev-parse --short HEAD)
#
# READ THIS BEFORE ENABLING THE DEPLOY STEP.
#
# Terraform owns this Cloud Run service, including which image it runs. When
# this build deploys a new image directly, Terraform does not know — and the
# next `terraform apply` sees an image it did not set and reverts it, silently
# rolling you back to whatever `./deploy.sh` last applied.
#
# Two ways to live with that, pick one:
#
#   1. Let this build push images only, and roll out with `./deploy.sh
#      --code-only`, which builds and applies together. Terraform stays the
#      source of truth. Set _DEPLOY=false below. This is the quieter option.
#
#   2. Keep the deploy step, and treat `terraform apply` as the thing that must
#      catch up: pass the tag this build produced the next time you apply.
#
# Nothing here creates the Artifact Registry repository or the service — run
# `./deploy.sh` once first.

substitutions:
  _REGION: us-central1
  _AR_REPO: dc-agent
  _INSTANCE: ''          # required: names the Cloud Run service, <instance>-agent
  _DEPLOY: 'true'        # 'false' builds and pushes without rolling out

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Deliberately no `images:` block. Cloud Build pushes those only after every
# step has succeeded, so the deploy step below would reference a tag that is
# not in the registry yet and fail. The push is an explicit step instead.

steps:
  # Fail early and loudly. Without _INSTANCE the deploy step would target a
  # service called "-agent", which does not exist, after a build that already
  # cost several minutes.
  - id: check
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if [ -z "${_INSTANCE}" ]; then
          echo "ERROR: _INSTANCE is required. Pass it with --substitutions." >&2
          exit 1
        fi
        echo "Building ${_INSTANCE}-agent at $SHORT_SHA"

  # The build context is agent/, matching what deploy.sh submits. Cloud Build
  # runs on amd64, which is what Cloud Run needs — an arm64 image is rejected
  # at startup with an error that never mentions architecture.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/agent:$SHORT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/agent:latest'
      - agent

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/agent'

  # Only the image changes. `services update` rather than `run deploy` because
  # it cannot quietly reset anything else about the service — the env vars,
  # scaling and service account all stay as Terraform set them.
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if [ "${_DEPLOY}" != "true" ]; then
          echo "_DEPLOY is not true — image pushed, service unchanged."
          exit 0
        fi
        gcloud run services update "${_INSTANCE}-agent" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/agent:$SHORT_SHA" \
          --quiet
        echo "Deployed ${_INSTANCE}-agent at $SHORT_SHA"

timeout: 1200s
